name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3
      with:
        versionSpec: "6.x"

    - name: Determine version
      id: version
      uses: gittools/actions/gitversion/execute@v3

    - name: Report version
      run: echo "Computed version ${{ steps.version.outputs.informationalVersion }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Run unit tests
      run: |
        for proj in OidcProxy.Net.Tests OidcProxy.Net.OpenIdConnect.Tests OidcProxy.Net.Auth0.Tests OidcProxy.Net.AzureAd.Tests; do
          dotnet test --project unittests/$proj --filter-namespace '*.UnitTests*' --ignore-exit-code 8
        done
